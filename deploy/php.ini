; Sistema NCIE · ajustes de PHP para producción
; (se monta como /usr/local/etc/php/conf.d/zz-ncie.ini en el contenedor app)
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 120
expose_php = Off
display_errors = Off
log_errors = On

; OPcache: código precompilado en memoria; revisa cambios cada 60 s
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
