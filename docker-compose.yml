services:
  # PHP-FPM con la aplicación Laravel
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ncie_app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  # Servidor web
  nginx:
    image: nginx:1.27-alpine
    container_name: ncie_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # Base de datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: ncie_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ncie
      POSTGRES_USER: ncie
      POSTGRES_PASSWORD: ncie_password
      # Collation en español (vía ICU) para que ORDER BY con acentos/ñ se comporte como utf8mb4_unicode_ci de MySQL
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=es-MX"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ncie -d ncie"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Node solo para compilar los assets de Vite (se ejecuta bajo demanda con --profile assets)
  node:
    image: node:20-alpine
    container_name: ncie_node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    profiles: ["assets"]
    command: sh -c "npm install && npm run build"

volumes:
  pgdata:
